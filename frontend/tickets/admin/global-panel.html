<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Global | TicketAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#2a5298', dark: '#1e3c72' },
          accent: '#27ae60'
        }
      }
    }
  }
</script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">

  <div class="flex flex-wrap items-center justify-between gap-3 bg-gradient-to-br from-slate-700 to-slate-900 px-6 py-5 text-white">
    <div>
      <h2 class="text-lg font-bold">🛡️ Administrador Global</h2>
      <div class="mt-0.5 text-xs text-slate-300">Todos los sistemas de tickets</div>
    </div>
    <button class="rounded-lg border border-white/30 bg-white/15 px-4 py-2 text-sm font-semibold transition hover:bg-white/25" onclick="logout()">Cerrar sesión</button>
  </div>

  <div class="mx-auto max-w-5xl px-5 py-8">
    <div id="summaryStats" class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>

    <div class="mb-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-brand-dark">Departamentos</h1>
      <button class="rounded-lg bg-gradient-to-br from-brand to-brand-dark px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-brand/25" onclick="toggleCreateForm()">+ Nuevo departamento</button>
    </div>

    <div id="createForm" class="mb-6 hidden rounded-2xl bg-white p-5 shadow-sm">
      <h3 class="mb-4 text-base font-bold text-brand-dark">Nuevo departamento / sistema de tickets</h3>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
        <input id="newSlug" placeholder="slug (ej. sistemas)" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
        <input id="newName" placeholder="Nombre (ej. Sistemas)" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
        <input id="newPasscode" placeholder="Contraseña de 8 dígitos" maxlength="8" inputmode="numeric" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm font-mono">
      </div>
      <p class="mt-2 text-xs text-slate-400">Se crea con los mismos dos tipos de ticket que Flota (Reporte de falla, Solicitud de vehículo) — listo para usarse igual desde el día uno.</p>
      <div id="createFormError" class="mt-3 hidden rounded-lg border-2 border-red-400 bg-red-50 px-3 py-2 text-sm font-semibold text-red-800"></div>
      <div class="mt-4 flex gap-2.5">
        <button class="rounded-lg bg-accent px-5 py-2.5 text-sm font-bold text-white transition hover:bg-emerald-700" onclick="submitCreate()">Crear</button>
        <button class="rounded-lg border-2 border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-600" onclick="toggleCreateForm()">Cancelar</button>
      </div>
    </div>

    <div id="departmentsList" class="space-y-3"></div>
  </div>

<script>
  let departments = [];

  async function loadDepartments() {
    const response = await fetch("/api/global/departments");
    if (response.status === 401) { location.href = "/global"; return; }
    if (!response.ok) { document.getElementById("departmentsList").innerHTML = '<p class="text-red-600">No se pudo cargar.</p>'; return; }
    const data = await response.json();
    departments = data.departments || [];
    renderSummary();
    renderDepartments();
  }

  function renderSummary() {
    const totalTickets = departments.reduce((sum, d) => sum + d.total_tickets, 0);
    const totalAbiertos = departments.reduce((sum, d) => sum + d.tickets_abiertos, 0);
    const sinPin = departments.filter(d => !d.passcode_configurado).length;
    const stats = [
      { label: "Departamentos", value: departments.length },
      { label: "Tickets totales", value: totalTickets },
      { label: "Tickets abiertos", value: totalAbiertos },
      { label: "Sin PIN configurado", value: sinPin }
    ];
    document.getElementById("summaryStats").innerHTML = stats.map(s => `
      <div class="rounded-2xl bg-white p-4 shadow-sm">
        <div class="text-2xl font-bold text-brand-dark">${s.value}</div>
        <div class="mt-1 text-xs font-semibold text-slate-500">${s.label}</div>
      </div>
    `).join("");
  }

  function renderDepartments() {
    const list = document.getElementById("departmentsList");
    if (!departments.length) {
      list.innerHTML = '<div class="py-16 text-center text-slate-400">Sin departamentos todavía.</div>';
      return;
    }
    list.innerHTML = departments.map(d => {
      const pinBadge = d.passcode_configurado
        ? `<span class="rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-bold text-emerald-800">✅ PIN configurado</span>`
        : `<span class="rounded-full bg-red-100 px-2.5 py-1 text-xs font-bold text-red-700">⚠️ Sin PIN</span>`;
      const googleBadge = d.google_connected_email
        ? `<span class="rounded-full bg-sky-100 px-2.5 py-1 text-xs font-semibold text-sky-800">📧 Google: ${d.google_connected_email}</span>`
        : "";
      return `
        <div class="rounded-2xl bg-white p-5 shadow-sm">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h3 class="text-base font-bold text-brand-dark">${d.name}</h3>
              <div class="text-xs text-slate-400">slug: ${d.slug}</div>
            </div>
            <div class="flex flex-wrap gap-2">${pinBadge}${googleBadge}</div>
          </div>
          <div class="mt-3 flex flex-wrap gap-4 text-sm text-slate-600">
            <div><strong class="text-brand-dark">${d.total_tickets}</strong> tickets totales</div>
            <div><strong class="text-brand-dark">${d.tickets_abiertos}</strong> abiertos</div>
            <div class="text-slate-400">correo de aviso: ${d.notification_email || "—"}</div>
          </div>
          <div class="mt-4 flex flex-wrap gap-2.5 border-t border-slate-100 pt-4">
            <a href="/admin" target="_blank" class="rounded-lg border-2 border-slate-200 px-4 py-2 text-xs font-semibold text-brand hover:bg-slate-50">Ir al panel de este departamento ↗</a>
            <button class="rounded-lg border-2 border-red-200 px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50" onclick="resetPasscode('${d.id}', '${d.name.replace(/'/g, "\\'")}')">Resetear PIN</button>
          </div>
        </div>
      `;
    }).join("");
  }

  async function resetPasscode(departmentId, name) {
    const passcode = prompt(`Nueva contraseña de 8 dígitos para "${name}":`);
    if (passcode === null) return;
    if (!/^\d{8}$/.test(passcode)) { alert("Debe ser exactamente 8 dígitos."); return; }
    const response = await fetch(`/api/global/departments/${departmentId}/passcode`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passcode })
    });
    if (!response.ok) { alert("No se pudo actualizar el PIN."); return; }
    alert(`PIN actualizado para "${name}".`);
    loadDepartments();
  }

  function toggleCreateForm() {
    const form = document.getElementById("createForm");
    form.classList.toggle("hidden");
    document.getElementById("createFormError").classList.add("hidden");
  }

  function createFormError(msg) {
    const el = document.getElementById("createFormError");
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  async function submitCreate() {
    const slug = document.getElementById("newSlug").value.trim().toLowerCase();
    const name = document.getElementById("newName").value.trim();
    const passcode = document.getElementById("newPasscode").value.trim();

    if (!slug || !name) { createFormError("slug y nombre son obligatorios"); return; }
    if (!/^\d{8}$/.test(passcode)) { createFormError("La contraseña debe ser de exactamente 8 dígitos"); return; }

    const response = await fetch("/api/global/departments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug, name, passcode })
    });
    const data = await response.json();
    if (!response.ok) { createFormError(data.detail || "No se pudo crear"); return; }

    toggleCreateForm();
    ["newSlug", "newName", "newPasscode"].forEach(id => document.getElementById(id).value = "");
    loadDepartments();
  }

  async function logout() {
    await fetch("/api/global/logout", { method: "POST" });
    location.href = "/global";
  }

  loadDepartments();
</script>
</body>
</html>
