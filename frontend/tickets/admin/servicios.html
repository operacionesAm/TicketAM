<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios Programados | TicketAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#2a5298', dark: '#1e3c72' },
          accent: '#27ae60'
        }
      }
    }
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">

  <div id="adminNav"></div>

  <div class="mx-auto max-w-5xl px-5 py-6 pb-16">
    <a href="/admin/dashboard" class="mb-4 inline-block text-sm font-semibold text-brand underline">‹ Dashboard</a>
    <h1 class="mb-1 text-xl font-bold text-brand-dark">Servicios Programados</h1>
    <p class="mb-4 text-sm text-slate-500">Mantenimiento preventivo/correctivo de motocicletas — al registrar un preventivo, el siguiente se programa automáticamente a un mes.</p>

    <div class="mb-4 flex flex-wrap items-center gap-3">
      <div class="flex gap-2">
        <button id="viewBtnGrid" onclick="switchServiciosView('grid')">🔲 Cuadrícula</button>
        <button id="viewBtnLista" onclick="switchServiciosView('lista')">📃 Lista</button>
      </div>
      <button class="ml-auto rounded-lg border-2 border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:border-brand hover:text-brand" onclick="exportServicios()">⬇️ Descargar XLSX</button>
    </div>

    <div id="gridView" class="hidden grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="listaView" class="space-y-2.5"></div>
  </div>

  <!-- MODAL REGISTRAR / HISTORIAL -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden items-start justify-center overflow-y-auto bg-black/50 p-5">
    <div class="my-8 w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">
      <div class="mb-4 flex items-start justify-between gap-3">
        <div>
          <div id="detailPlaca" class="font-mono text-lg font-bold text-brand-dark"></div>
          <div id="detailModelo" class="text-sm text-slate-500"></div>
          <div id="detailEstadoBadge" class="mt-1.5"></div>
        </div>
        <button class="text-2xl leading-none text-slate-400 hover:text-slate-600" onclick="cerrarDetalle()">&times;</button>
      </div>

      <div class="mb-5 grid grid-cols-1 gap-3 rounded-xl bg-slate-50 p-4 sm:grid-cols-2">
        <select id="servicioTipo" class="rounded-lg border-2 border-slate-200 px-3 py-2 text-sm">
          <option value="preventivo">🔧 Preventivo</option>
          <option value="correctivo">🛠️ Correctivo</option>
        </select>
        <input id="servicioFecha" type="date" class="rounded-lg border-2 border-slate-200 px-3 py-2 text-sm">
        <input id="servicioNotas" type="text" placeholder="Notas (opcional)" class="rounded-lg border-2 border-slate-200 px-3 py-2 text-sm sm:col-span-2">
        <button class="rounded-lg bg-accent px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700 sm:col-span-2" onclick="registrarServicio()">Registrar servicio</button>
      </div>
      <div id="servicioError" class="mb-4 hidden text-xs font-semibold text-red-600"></div>

      <h2 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Historial</h2>
      <div id="servicioHistorial" class="space-y-2"></div>
    </div>
  </div>

<script src="/tickets/admin/admin-shared.js"></script>
<script>
  const UMBRAL_DIAS = 7;
  const VIEW_BTN_ACTIVE = ["rounded-lg", "px-4", "py-2.5", "text-sm", "font-bold", "text-white", "bg-gradient-to-br", "from-brand", "to-brand-dark", "shadow-md", "shadow-brand/25"];
  const VIEW_BTN_INACTIVE = ["rounded-lg", "px-4", "py-2.5", "text-sm", "font-bold", "text-slate-500", "bg-white", "hover:text-brand"];

  let motos = [];
  let servicios = [];
  let serviciosView = "grid";
  let entityIdSeleccionado = null;

  async function init() {
    const dept = await requireSession();
    if (!dept) return;
    renderNav("servicios", dept);

    const [entitiesRes, serviciosRes] = await Promise.all([
      fetch("/api/admin/entities"),
      fetch("/api/admin/servicios")
    ]);
    const entitiesData = await entitiesRes.json();
    const serviciosData = serviciosRes.ok ? await serviciosRes.json() : { servicios: [] };

    motos = (entitiesData.entities || []).filter(e => (e.atributos || {}).tipo === "Motocicleta");
    servicios = serviciosData.servicios || [];

    document.getElementById("servicioFecha").value = new Date().toISOString().slice(0, 10);
    switchServiciosView("grid");
  }

  function switchServiciosView(view) {
    serviciosView = view;
    document.getElementById("viewBtnGrid").className = (view === "grid" ? VIEW_BTN_ACTIVE : VIEW_BTN_INACTIVE).join(" ");
    document.getElementById("viewBtnLista").className = (view === "lista" ? VIEW_BTN_ACTIVE : VIEW_BTN_INACTIVE).join(" ");
    document.getElementById("gridView").classList.toggle("hidden", view !== "grid");
    document.getElementById("listaView").classList.toggle("hidden", view !== "lista");
    render();
  }

  function ultimoPreventivo(entityId) {
    const propios = servicios.filter(s => s.entity_id === entityId && s.tipo === "preventivo" && s.proximo_servicio_fecha);
    if (!propios.length) return null;
    return propios.reduce((latest, s) => new Date(s.fecha) > new Date(latest.fecha) ? s : latest, propios[0]);
  }

  function estadoServicio(proximoIso) {
    if (!proximoIso) return { label: "Sin servicio registrado", clase: "bg-slate-100 text-slate-500", dias: null };
    const dias = Math.ceil((new Date(proximoIso) - Date.now()) / 86400000);
    if (dias < 0) return { label: `Vencido hace ${Math.abs(dias)} días`, clase: "bg-red-100 text-red-700", dias };
    if (dias <= UMBRAL_DIAS) return { label: `Próximo en ${dias} días`, clase: "bg-amber-100 text-amber-800", dias };
    return { label: `Al día · en ${dias} días`, clase: "bg-emerald-100 text-emerald-800", dias };
  }

  function filasOrdenadas() {
    return motos.map(m => {
      const ultimo = ultimoPreventivo(m.id);
      const estado = estadoServicio(ultimo ? ultimo.proximo_servicio_fecha : null);
      return { moto: m, ultimo, estado };
    }).sort((a, b) => {
      const da = a.estado.dias === null ? Infinity - 1 : a.estado.dias;
      const db = b.estado.dias === null ? Infinity : b.estado.dias;
      return da - db;
    });
  }

  function render() {
    const filas = filasOrdenadas();
    if (!filas.length) {
      document.getElementById("gridView").innerHTML = `<div class="col-span-full py-16 text-center text-slate-400">Sin motocicletas registradas en el inventario.</div>`;
      document.getElementById("listaView").innerHTML = `<div class="py-16 text-center text-slate-400">Sin motocicletas registradas en el inventario.</div>`;
      return;
    }
    if (serviciosView === "grid") {
      document.getElementById("gridView").innerHTML = filas.map(renderGridCard).join("");
    } else {
      document.getElementById("listaView").innerHTML = filas.map(renderListRow).join("");
    }
  }

  function renderGridCard({ moto, ultimo, estado }) {
    const a = moto.atributos || {};
    return `
      <div class="rounded-2xl bg-white p-4 text-center shadow-sm">
        <div class="font-mono text-sm font-bold text-brand-dark">${moto.codigo}</div>
        <div class="mt-1 text-sm text-slate-600">${[a.marca, a.modelo].filter(Boolean).join(" ") || moto.nombre || "—"}</div>
        <div class="mt-2"><span class="rounded-full ${estado.clase} px-2.5 py-1 text-xs font-bold">${estado.label}</span></div>
        ${ultimo ? `<div class="mt-1.5 text-[11px] text-slate-400">Último preventivo: ${formatDate(ultimo.fecha)}</div>` : ""}
        <button class="mt-3 w-full rounded-md border border-slate-200 py-1.5 text-xs font-semibold text-brand hover:bg-slate-50" onclick="abrirDetalle('${moto.id}')">Ver / Registrar servicio</button>
      </div>
    `;
  }

  function renderListRow({ moto, ultimo, estado }) {
    const a = moto.atributos || {};
    return `
      <div class="flex flex-wrap items-center gap-3 rounded-xl bg-white p-3.5 shadow-sm sm:flex-nowrap">
        <div class="min-w-0 flex-1">
          <div class="font-mono text-sm font-bold text-brand-dark">${moto.codigo}</div>
          <div class="text-xs text-slate-500">${[a.marca, a.modelo].filter(Boolean).join(" ") || moto.nombre || "—"}</div>
          <div class="mt-1.5"><span class="rounded-full ${estado.clase} px-2.5 py-1 text-xs font-bold">${estado.label}</span></div>
          ${ultimo ? `<div class="mt-1 text-[11px] text-slate-400">Último preventivo: ${formatDate(ultimo.fecha)}</div>` : ""}
        </div>
        <button class="shrink-0 rounded-md border border-slate-200 px-3 py-1.5 text-xs font-semibold text-brand hover:bg-slate-50" onclick="abrirDetalle('${moto.id}')">Ver / Registrar servicio</button>
      </div>
    `;
  }

  function abrirDetalle(entityId) {
    entityIdSeleccionado = entityId;
    const moto = motos.find(m => m.id === entityId);
    if (!moto) return;
    const a = moto.atributos || {};
    const ultimo = ultimoPreventivo(entityId);
    const estado = estadoServicio(ultimo ? ultimo.proximo_servicio_fecha : null);

    document.getElementById("detailPlaca").textContent = moto.codigo;
    document.getElementById("detailModelo").textContent = [a.marca, a.modelo].filter(Boolean).join(" ") || moto.nombre || "—";
    document.getElementById("detailEstadoBadge").innerHTML = `<span class="rounded-full ${estado.clase} px-2.5 py-1 text-xs font-bold">${estado.label}</span>`;
    document.getElementById("servicioError").classList.add("hidden");
    document.getElementById("servicioNotas").value = "";
    renderHistorial(entityId);
    document.getElementById("detailModal").classList.remove("hidden");
    document.getElementById("detailModal").classList.add("flex");
  }

  function cerrarDetalle() {
    entityIdSeleccionado = null;
    document.getElementById("detailModal").classList.add("hidden");
    document.getElementById("detailModal").classList.remove("flex");
  }

  function renderHistorial(entityId) {
    const propios = servicios.filter(s => s.entity_id === entityId).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    const el = document.getElementById("servicioHistorial");
    if (!propios.length) {
      el.innerHTML = `<div class="text-sm text-slate-400">Sin servicios registrados todavía.</div>`;
      return;
    }
    el.innerHTML = propios.map(s => `
      <div class="rounded-lg bg-slate-50 p-3 text-sm">
        <div class="flex items-center justify-between">
          <span class="font-bold ${s.tipo === "preventivo" ? "text-brand-dark" : "text-orange-700"}">${s.tipo === "preventivo" ? "🔧 Preventivo" : "🛠️ Correctivo"}</span>
          <span class="text-xs text-slate-400">${formatDate(s.fecha)}</span>
        </div>
        ${s.notas ? `<div class="mt-1 text-slate-600">${s.notas}</div>` : ""}
        ${s.proximo_servicio_fecha ? `<div class="mt-1 text-xs text-slate-400">Siguiente programado: ${formatDate(s.proximo_servicio_fecha)}</div>` : ""}
      </div>
    `).join("");
  }

  async function registrarServicio() {
    if (!entityIdSeleccionado) return;
    const moto = motos.find(m => m.id === entityIdSeleccionado);
    if (!moto) return;
    const a = moto.atributos || {};
    const modelo = [a.marca, a.modelo].filter(Boolean).join(" ") || moto.nombre || "—";

    if (!confirm(`¿Confirmas que el servicio es para esta moto?\n\n${moto.codigo} — ${modelo}`)) return;

    const tipo = document.getElementById("servicioTipo").value;
    const fechaInput = document.getElementById("servicioFecha").value;
    const notas = document.getElementById("servicioNotas").value.trim();
    const errorEl = document.getElementById("servicioError");
    errorEl.classList.add("hidden");

    const payload = { entity_id: entityIdSeleccionado, tipo, notas: notas || undefined };
    if (fechaInput) payload.fecha = new Date(fechaInput + "T12:00:00").toISOString();

    const response = await fetch("/api/admin/servicios", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      errorEl.textContent = data.detail || "No se pudo registrar el servicio.";
      errorEl.classList.remove("hidden");
      return;
    }
    const data = await response.json();
    servicios.unshift(data.servicio);
    document.getElementById("servicioNotas").value = "";
    render();
    abrirDetalle(entityIdSeleccionado);
  }

  function exportServicios() {
    const filas = filasOrdenadas().map(({ moto, ultimo, estado }) => {
      const a = moto.atributos || {};
      return {
        placa: moto.codigo,
        marca_modelo: [a.marca, a.modelo].filter(Boolean).join(" ") || moto.nombre || "",
        estado_servicio: estado.label,
        ultimo_preventivo: ultimo ? formatDate(ultimo.fecha) : "—",
        proximo_servicio: ultimo && ultimo.proximo_servicio_fecha ? formatDate(ultimo.proximo_servicio_fecha) : "—",
        proximo_servicio_iso: ultimo ? ultimo.proximo_servicio_fecha : null
      };
    });
    openExportModal({
      title: "Descargar Servicios Programados",
      columns: [
        { key: "placa", label: "Placa" },
        { key: "marca_modelo", label: "Marca / Modelo" },
        { key: "estado_servicio", label: "Estado del servicio" },
        { key: "ultimo_preventivo", label: "Último preventivo" },
        { key: "proximo_servicio", label: "Próximo servicio" }
      ],
      rows: filas,
      filenameBase: "servicios-programados",
      dateKey: "proximo_servicio_iso"
    });
  }

  init();
</script>
</body>
</html>
