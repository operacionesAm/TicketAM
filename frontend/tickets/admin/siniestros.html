<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Siniestros | TicketAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#2a5298', dark: '#1e3c72' },
          accent: '#27ae60'
        }
      }
    }
  }
</script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">

  <div id="adminNav"></div>

  <div class="mx-auto max-w-5xl px-5 py-6 pb-16">
    <a href="/admin/dashboard" class="mb-4 inline-block text-sm font-semibold text-brand underline">‹ Dashboard</a>
    <h1 class="mb-1 text-xl font-bold text-brand-dark">Histórico de Siniestros</h1>
    <p class="mb-4 text-sm text-slate-500">Reportes de falla clasificados como Siniestro, consolidados por unidad y solicitante.</p>

    <div class="mb-4 flex flex-wrap items-center gap-3">
      <input id="siniestrosSearch" type="text" placeholder="Buscar por placa, solicitante o folio…" class="min-w-[240px] flex-1 rounded-lg border-2 border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-brand">
      <span id="siniestrosCount" class="text-sm text-slate-500"></span>
    </div>

    <div id="siniestrosList" class="space-y-2.5"></div>
  </div>

  <!-- DETALLE (solo lectura) -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden items-start justify-center overflow-y-auto bg-black/50 p-5">
    <div class="my-8 w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">
      <div class="mb-4 flex items-start justify-between gap-3">
        <div>
          <div id="detailFolio" class="font-mono text-sm font-bold text-slate-400"></div>
          <h3 id="detailPlaca" class="text-lg font-bold text-brand-dark"></h3>
        </div>
        <button class="text-2xl leading-none text-slate-400 hover:text-slate-600" onclick="closeDetail()">&times;</button>
      </div>
      <div id="detailInfo" class="grid grid-cols-1 gap-x-4 gap-y-2 text-sm sm:grid-cols-2"></div>
    </div>
  </div>

<script src="/tickets/admin/admin-shared.js"></script>
<script>
  let siniestros = [];

  async function init() {
    const dept = await requireSession();
    if (!dept) return;
    renderNav("dashboard", dept);

    const [ticketsRes, entitiesRes] = await Promise.all([
      fetch("/api/admin/tickets"),
      fetch("/api/admin/entities")
    ]);
    const ticketsData = await ticketsRes.json();
    const entitiesData = await entitiesRes.json();

    const entitiesById = {};
    (entitiesData.entities || []).forEach(e => entitiesById[e.id] = e);

    siniestros = (ticketsData.tickets || [])
      .filter(t => t.incidente_tipo === "Siniestro")
      .map(t => ({ ticket: t, entity: entitiesById[t.entity_id] }))
      .sort((a, b) => new Date(b.ticket.created_at) - new Date(a.ticket.created_at));

    document.getElementById("siniestrosSearch").addEventListener("input", render);
    render();
  }

  function render() {
    const query = (document.getElementById("siniestrosSearch").value || "").trim().toLowerCase();
    const visibles = !query ? siniestros : siniestros.filter(({ ticket, entity }) =>
      [ticket.folio, ticket.solicitante_nombre, entity?.codigo].filter(Boolean).join(" ").toLowerCase().includes(query)
    );
    document.getElementById("siniestrosCount").textContent = `${visibles.length} de ${siniestros.length} siniestros`;

    const list = document.getElementById("siniestrosList");
    if (!visibles.length) {
      list.innerHTML = `<div class="py-16 text-center text-slate-400">Sin siniestros registrados todavía.</div>`;
      return;
    }
    list.innerHTML = visibles.map(({ ticket, entity }) => `
      <div class="flex flex-wrap items-center gap-3 rounded-xl bg-white p-3.5 shadow-sm sm:flex-nowrap">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-mono text-[11px] font-bold text-slate-400">${ticket.folio}</span>
            <span class="rounded-full bg-red-100 px-2 py-0.5 text-[11px] font-bold text-red-700">🚨 Siniestro</span>
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-bold text-slate-600">${ticket.estado}</span>
          </div>
          <div class="mt-1 text-sm font-bold text-brand-dark">${ticket.solicitante_nombre}</div>
          <div class="mt-1 truncate text-xs text-slate-500">${(ticket.campos || {}).descripcion || ""}</div>
          <div class="mt-1.5 flex items-center gap-1.5">
            ${entity ? `<span class="rounded-full bg-brand/10 px-2 py-0.5 text-[11px] font-bold text-brand-dark">${entity.codigo}</span>` : `<span class="text-[11px] text-slate-400">Sin vehículo asociado</span>`}
          </div>
          <div class="mt-1 text-[11px] text-slate-400">${formatDate(ticket.created_at)}</div>
        </div>
        <button class="shrink-0 rounded-md border border-slate-200 px-3 py-1.5 text-xs font-semibold text-brand hover:bg-slate-50" onclick="openDetail('${ticket.id}')">Ver detalle</button>
      </div>
    `).join("");
  }

  function openDetail(ticketId) {
    const row = siniestros.find(s => s.ticket.id === ticketId);
    if (!row) return;
    const { ticket, entity } = row;
    const campos = ticket.campos || {};

    document.getElementById("detailFolio").textContent = ticket.folio;
    document.getElementById("detailPlaca").textContent = entity
      ? `${entity.codigo} — ${[entity.atributos?.marca, entity.atributos?.modelo].filter(Boolean).join(" ")}`
      : "Sin vehículo asociado";

    const info = [
      ["Fecha/hora", formatDate(ticket.created_at)],
      ["Solicitante", ticket.solicitante_nombre],
      ["Correo", ticket.solicitante_email],
      ["Departamento", campos.departamento_solicitante || "—"],
      ["Descripción", campos.descripcion || "—"],
      ["Estado", ticket.estado],
      ["Prioridad", ticket.prioridad || "—"],
      ["Fecha de resolución", ticket.resolved_at ? formatDate(ticket.resolved_at) : "—"]
    ];
    document.getElementById("detailInfo").innerHTML = info.map(([label, value]) => `
      <div>
        <div class="text-[11px] font-bold uppercase tracking-wide text-slate-400">${label}</div>
        <div class="text-slate-700">${value}</div>
      </div>
    `).join("");

    document.getElementById("detailModal").classList.remove("hidden");
    document.getElementById("detailModal").classList.add("flex");
  }

  function closeDetail() {
    document.getElementById("detailModal").classList.add("hidden");
    document.getElementById("detailModal").classList.remove("flex");
  }

  init();
</script>
</body>
</html>
