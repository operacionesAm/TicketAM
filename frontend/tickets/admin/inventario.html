<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de unidades | TicketAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#2a5298', dark: '#1e3c72' },
          accent: '#27ae60'
        }
      }
    }
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">

  <div id="adminNav"></div>

  <div class="mx-auto max-w-5xl px-5 py-6 pb-16">
    <a href="/admin/dashboard" class="mb-4 inline-block text-sm font-semibold text-brand underline">‹ Dashboard</a>
    <h1 class="mb-4 text-xl font-bold text-brand-dark">Inventario de unidades</h1>

    <div id="fleetStats" class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2"></div>

    <div class="mb-4 flex flex-wrap items-center gap-3">
      <input id="entitySearch" type="text" placeholder="Buscar por placa, marca, modelo o razón social…" class="min-w-[240px] flex-1 rounded-lg border-2 border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-brand" oninput="renderEntities()">
      <span id="entityCount" class="text-sm text-slate-500"></span>
      <div class="flex gap-2">
        <button id="viewBtnGrid" onclick="switchInventoryView('grid')">🔲 Cuadrícula</button>
        <button id="viewBtnLista" onclick="switchInventoryView('lista')">📃 Lista</button>
      </div>
      <button id="printModeBtn" class="rounded-lg border-2 border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:border-brand hover:text-brand" onclick="togglePrintMode()">🖨️ Imprimir PDF</button>
      <button class="rounded-lg border-2 border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:border-brand hover:text-brand" onclick="exportInventario()">⬇️ Descargar XLSX</button>
      <button class="rounded-lg bg-gradient-to-br from-brand to-brand-dark px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-brand/25" onclick="startCreate()">+ Agregar vehículo</button>
    </div>

    <div id="printToolbar" class="mb-4 hidden flex-wrap items-center gap-3 rounded-2xl border-2 border-brand/20 bg-brand/5 px-4 py-3">
      <span id="printSelectedCount" class="text-sm font-bold text-brand-dark">0 seleccionados</span>
      <button class="text-xs font-semibold text-brand underline" onclick="selectAllForPrint()">Seleccionar todos</button>
      <button class="text-xs font-semibold text-brand underline" onclick="selectNoneForPrint()">Deseleccionar todos</button>
      <button id="exportPdfBtn" class="ml-auto rounded-lg bg-accent px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700" onclick="exportSelectedToPdf()">Exportar PDF</button>
      <button class="rounded-lg border-2 border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600" onclick="togglePrintMode()">Cancelar</button>
    </div>

    <div class="mb-4 flex flex-wrap items-center gap-3">
      <span class="text-xs font-bold uppercase tracking-wide text-slate-400">Filtrar por:</span>
      <select id="filterTipo" class="rounded-lg border-2 border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand" onchange="renderEntities()">
        <option value="">Tipo (todos)</option>
        <option value="Automovil">Automóvil</option>
        <option value="Motocicleta">Motocicleta</option>
        <option value="Camioneta">Camioneta</option>
        <option value="Camión">Camión</option>
        <option value="Van">Van</option>
        <option value="Otro">Otro</option>
      </select>
      <select id="filterMarca" class="rounded-lg border-2 border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand" onchange="renderEntities()">
        <option value="">Marca (todas)</option>
      </select>
      <select id="filterDepartamento" class="rounded-lg border-2 border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand" onchange="renderEntities()">
        <option value="">Razón social (todas)</option>
        <option value="EMA">EMA</option>
        <option value="Distribuciones">Distribuciones</option>
      </select>
      <select id="filterEstado" class="rounded-lg border-2 border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand" onchange="renderEntities()">
        <option value="">Estado (todos)</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
      <button class="text-xs font-semibold text-brand underline" onclick="clearFilters()">Limpiar filtros</button>
    </div>

    <div id="entityForm" class="mb-6 hidden rounded-2xl bg-white p-5 shadow-sm">
      <h3 id="entityFormTitle" class="mb-4 text-base font-bold text-brand-dark">Nuevo vehículo</h3>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
        <input id="formPlaca" placeholder="Placa *" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
        <select id="formTipo" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
          <option value="">Tipo de vehículo…</option>
          <option value="Automovil">Automóvil</option>
          <option value="Motocicleta">Motocicleta</option>
          <option value="Camioneta">Camioneta</option>
          <option value="Camión">Camión</option>
          <option value="Van">Van</option>
          <option value="Otro">Otro</option>
        </select>
        <input id="formMarca" placeholder="Marca" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
        <input id="formModelo" placeholder="Modelo" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
        <input id="formAnio" placeholder="Año" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
        <select id="formEstado" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
        <select id="formDepartamento" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
          <option value="">Razón social…</option>
          <option value="EMA">EMA</option>
          <option value="Distribuciones">Distribuciones</option>
        </select>
        <select id="formCombustible" class="rounded-lg border-2 border-slate-200 px-3 py-2.5 text-sm">
          <option value="">Combustible…</option>
          <option value="Gasolina">Gasolina</option>
          <option value="Diesel">Diesel</option>
          <option value="Electrico">Eléctrico</option>
        </select>
      </div>
      <div id="entityFormError" class="mt-3 hidden rounded-lg border-2 border-red-400 bg-red-50 px-3 py-2 text-sm font-semibold text-red-800"></div>
      <div class="mt-4 flex gap-2.5">
        <button id="entityFormSubmit" class="rounded-lg bg-accent px-5 py-2.5 text-sm font-bold text-white transition hover:bg-emerald-700" onclick="submitEntity()">Crear y generar QR</button>
        <button class="rounded-lg border-2 border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-600" onclick="closeForm()">Cancelar</button>
      </div>
    </div>

    <div id="tableView" class="overflow-x-auto rounded-2xl bg-white shadow-sm">
      <table class="w-full min-w-[720px] text-left text-sm">
        <thead>
          <tr class="border-b border-slate-100 text-xs uppercase tracking-wide text-slate-400">
            <th id="tableSelectHeader" class="hidden px-4 py-3"></th>
            <th class="px-4 py-3">Placa</th>
            <th class="px-4 py-3">Tipo</th>
            <th class="px-4 py-3">Marca / Modelo</th>
            <th class="px-4 py-3">Año</th>
            <th class="px-4 py-3">Estado</th>
            <th class="px-4 py-3">Razón social</th>
            <th class="px-4 py-3">Combustible</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="entitiesTableBody"></tbody>
      </table>
    </div>

    <div id="gridView" class="hidden grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </div>

  <!-- MODAL QR -->
  <div id="qrModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-5">
    <div class="w-full max-w-xs rounded-2xl bg-white p-6 text-center shadow-2xl">
      <h3 id="qrModalTitle" class="mb-4 text-base font-bold text-brand-dark">QR del vehículo</h3>
      <img id="qrModalImg" class="mx-auto mb-4 h-48 w-48 rounded-lg border-2 border-slate-100" alt="Código QR">
      <a id="qrModalDownload" class="mb-2 block w-full rounded-lg bg-accent px-4 py-2.5 text-sm font-bold text-white" download>Descargar QR</a>
      <button class="w-full rounded-lg border-2 border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600" onclick="closeQrModal()">Cerrar</button>
    </div>
  </div>

<script src="/tickets/admin/admin-shared.js"></script>
<script>
  let entities = [];
  let editingEntityId = null;
  let inventoryView = "lista";
  let printMode = false;
  let selectedForPrint = new Set();

  const VIEW_BTN_ACTIVE = ["rounded-lg", "px-4", "py-2.5", "text-sm", "font-bold", "text-white", "bg-gradient-to-br", "from-brand", "to-brand-dark", "shadow-md", "shadow-brand/25"];
  const VIEW_BTN_INACTIVE = ["rounded-lg", "px-4", "py-2.5", "text-sm", "font-bold", "text-slate-500", "bg-white", "hover:text-brand"];

  async function loadEntities() {
    const response = await fetch("/api/admin/entities");
    if (response.status === 401) { location.href = "/admin"; return; }
    const data = await response.json();
    entities = data.entities || [];
    populateMarcaFilter();
    renderFleetStats();
    renderEntities();
  }

  function renderFleetStats() {
    const razones = ["EMA", "Distribuciones"];
    const cards = razones.map(razon => {
      const deVehiculos = entities.filter(e => (e.atributos || {}).departamento === razon);
      const activos = deVehiculos.filter(e => (e.atributos || {}).estado !== "Inactivo").length;
      const inactivos = deVehiculos.length - activos;
      return `
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <div class="text-xs font-bold uppercase tracking-wide text-slate-400">${razon}</div>
          <div class="mt-1 text-2xl font-bold text-brand-dark">${deVehiculos.length}</div>
          <div class="mt-1 text-xs text-slate-500">
            <span class="font-semibold text-emerald-700">${activos} activos</span> · <span class="font-semibold text-slate-500">${inactivos} inactivos</span>
          </div>
        </div>
      `;
    }).join("");
    document.getElementById("fleetStats").innerHTML = cards;
  }

  function populateMarcaFilter() {
    const select = document.getElementById("filterMarca");
    const current = select.value;
    const marcas = [...new Set(entities.map(e => (e.atributos || {}).marca).filter(Boolean))].sort();
    select.innerHTML = `<option value="">Marca (todas)</option>` + marcas.map(m => `<option value="${m}">${m}</option>`).join("");
    select.value = marcas.includes(current) ? current : "";
  }

  function clearFilters() {
    document.getElementById("entitySearch").value = "";
    document.getElementById("filterTipo").value = "";
    document.getElementById("filterMarca").value = "";
    document.getElementById("filterDepartamento").value = "";
    document.getElementById("filterEstado").value = "";
    renderEntities();
  }

  function switchInventoryView(view) {
    inventoryView = view;
    document.getElementById("viewBtnGrid").className = (view === "grid" ? VIEW_BTN_ACTIVE : VIEW_BTN_INACTIVE).join(" ");
    document.getElementById("viewBtnLista").className = (view === "lista" ? VIEW_BTN_ACTIVE : VIEW_BTN_INACTIVE).join(" ");
    document.getElementById("tableView").classList.toggle("hidden", view !== "lista");
    document.getElementById("gridView").classList.toggle("hidden", view !== "grid");
    renderEntities();
  }

  function filteredEntities() {
    const query = (document.getElementById("entitySearch").value || "").trim().toLowerCase();
    const tipo = document.getElementById("filterTipo").value;
    const marca = document.getElementById("filterMarca").value;
    const departamento = document.getElementById("filterDepartamento").value;
    const estado = document.getElementById("filterEstado").value;

    return entities.filter(e => {
      const a = e.atributos || {};
      if (query && ![e.codigo, a.marca, a.modelo, a.departamento, a.tipo].join(" ").toLowerCase().includes(query)) return false;
      if (tipo && a.tipo !== tipo) return false;
      if (marca && a.marca !== marca) return false;
      if (departamento && a.departamento !== departamento) return false;
      if (estado && a.estado !== estado) return false;
      return true;
    });
  }

  function renderEntities() {
    const filtered = filteredEntities();
    document.getElementById("entityCount").textContent = `${filtered.length} de ${entities.length} vehículos`;
    if (inventoryView === "grid") {
      renderEntitiesGrid(filtered);
    } else {
      renderEntitiesTable(filtered);
    }
  }

  function renderEntitiesTable(filtered) {
    const body = document.getElementById("entitiesTableBody");
    if (!filtered.length) {
      body.innerHTML = `<tr><td colspan="${printMode ? 9 : 8}" class="px-4 py-10 text-center text-slate-400">Sin vehículos que coincidan.</td></tr>`;
      return;
    }
    body.innerHTML = filtered.map(e => {
      const a = e.atributos || {};
      const estadoClass = a.estado === "Inactivo" ? "bg-slate-200 text-slate-600" : "bg-emerald-100 text-emerald-800";
      const checkboxCell = printMode
        ? `<td class="px-4 py-3"><input type="checkbox" class="h-4 w-4" ${selectedForPrint.has(e.id) ? "checked" : ""} onchange="toggleSelectedForPrint('${e.id}')"></td>`
        : "";
      return `
        <tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50">
          ${checkboxCell}
          <td class="px-4 py-3 font-mono font-bold text-brand-dark">${e.codigo}</td>
          <td class="px-4 py-3 text-slate-600">${a.tipo || "—"}</td>
          <td class="px-4 py-3 text-slate-600">${[a.marca, a.modelo].filter(Boolean).join(" ") || e.nombre || "—"}</td>
          <td class="px-4 py-3 text-slate-600">${a.año || "—"}</td>
          <td class="px-4 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-bold ${estadoClass}">${a.estado || "—"}</span></td>
          <td class="px-4 py-3 text-slate-600">${a.departamento || "—"}</td>
          <td class="px-4 py-3 text-slate-600">${a.combustible || "—"}</td>
          <td class="px-4 py-3 whitespace-nowrap">
            <button class="text-xs font-semibold text-brand underline" onclick="viewQr('${e.id}','${e.codigo}')">Ver QR</button>
            <button class="ml-3 text-xs font-semibold text-brand underline" onclick="startEdit('${e.id}')">Editar</button>
            <button class="ml-3 text-xs font-semibold text-red-600 underline" onclick="deleteEntity('${e.id}','${e.codigo}')">Eliminar</button>
          </td>
        </tr>
      `;
    }).join("");
  }

  function renderEntitiesGrid(filtered) {
    const grid = document.getElementById("gridView");
    if (!filtered.length) {
      grid.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400">Sin vehículos que coincidan.</div>`;
      return;
    }
    grid.innerHTML = filtered.map(e => {
      const a = e.atributos || {};
      const estadoClass = a.estado === "Inactivo" ? "bg-slate-200 text-slate-600" : "bg-emerald-100 text-emerald-800";
      const checkbox = printMode
        ? `<input type="checkbox" class="absolute left-3 top-3 h-5 w-5" ${selectedForPrint.has(e.id) ? "checked" : ""} onchange="toggleSelectedForPrint('${e.id}')">`
        : "";
      return `
        <div class="relative rounded-2xl bg-white p-4 text-center shadow-sm">
          ${checkbox}
          <img src="/api/admin/entities/${e.id}/qr" loading="lazy" alt="QR de ${e.codigo}" class="mx-auto mb-3 h-36 w-36 rounded-lg border-2 border-slate-100 object-contain">
          <div class="font-mono text-sm font-bold text-brand-dark">${e.codigo}</div>
          <div class="mt-1 text-sm text-slate-600">${[a.marca, a.modelo].filter(Boolean).join(" ") || e.nombre || "—"}</div>
          <div class="mt-2 flex flex-wrap items-center justify-center gap-1.5">
            <span class="rounded-full px-2.5 py-1 text-xs font-bold ${estadoClass}">${a.estado || "—"}</span>
            ${a.tipo ? `<span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">${a.tipo}</span>` : ""}
          </div>
          <div class="mt-2 text-left text-xs text-slate-500">
            <div>Año: ${a.año || "—"}</div>
            <div>Razón social: ${a.departamento || "—"}</div>
            <div>Combustible: ${a.combustible || "—"}</div>
          </div>
          <div class="mt-3 flex justify-center gap-3 border-t border-slate-100 pt-3">
            <button class="text-xs font-semibold text-brand underline" onclick="viewQr('${e.id}','${e.codigo}')">Ampliar QR</button>
            <button class="text-xs font-semibold text-brand underline" onclick="startEdit('${e.id}')">Editar</button>
            <button class="text-xs font-semibold text-red-600 underline" onclick="deleteEntity('${e.id}','${e.codigo}')">Eliminar</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // Selecciona la opción que coincida sin importar mayúsculas/acentos de más -
  // el inventario importado trae variantes como "ELECTRICO" / "Electrico".
  function setSelectValue(selectEl, rawValue) {
    const value = rawValue || "";
    const match = Array.from(selectEl.options).find(o => o.value.toLowerCase() === value.toLowerCase());
    selectEl.value = match ? match.value : value;
  }

  function fillForm(atributos, codigo) {
    document.getElementById("formPlaca").value = codigo || "";
    setSelectValue(document.getElementById("formTipo"), atributos.tipo);
    document.getElementById("formMarca").value = atributos.marca || "";
    document.getElementById("formModelo").value = atributos.modelo || "";
    document.getElementById("formAnio").value = atributos.año || "";
    setSelectValue(document.getElementById("formEstado"), atributos.estado || "Activo");
    setSelectValue(document.getElementById("formDepartamento"), atributos.departamento);
    setSelectValue(document.getElementById("formCombustible"), atributos.combustible);
  }

  function startCreate() {
    editingEntityId = null;
    document.getElementById("entityFormTitle").textContent = "Nuevo vehículo";
    document.getElementById("entityFormSubmit").textContent = "Crear y generar QR";
    fillForm({});
    document.getElementById("entityFormError").classList.add("hidden");
    document.getElementById("entityForm").classList.remove("hidden");
    document.getElementById("entityForm").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function startEdit(entityId) {
    const entity = entities.find(e => e.id === entityId);
    if (!entity) return;
    editingEntityId = entityId;
    document.getElementById("entityFormTitle").textContent = `Editar vehículo: ${entity.codigo}`;
    document.getElementById("entityFormSubmit").textContent = "Guardar cambios";
    fillForm(entity.atributos || {}, entity.codigo);
    document.getElementById("entityFormError").classList.add("hidden");
    document.getElementById("entityForm").classList.remove("hidden");
    document.getElementById("entityForm").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function closeForm() {
    editingEntityId = null;
    document.getElementById("entityForm").classList.add("hidden");
  }

  function entityFormError(msg) {
    const el = document.getElementById("entityFormError");
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  function readForm() {
    const codigo = document.getElementById("formPlaca").value.trim().toUpperCase();
    const atributos = {
      tipo: document.getElementById("formTipo").value.trim(),
      marca: document.getElementById("formMarca").value.trim(),
      modelo: document.getElementById("formModelo").value.trim(),
      año: document.getElementById("formAnio").value.trim(),
      estado: document.getElementById("formEstado").value,
      departamento: document.getElementById("formDepartamento").value.trim(),
      combustible: document.getElementById("formCombustible").value.trim()
    };
    const nombre = [atributos.marca, atributos.modelo].filter(Boolean).join(" ");
    return { codigo, nombre, atributos };
  }

  async function submitEntity() {
    const { codigo, nombre, atributos } = readForm();
    if (!codigo) { entityFormError("La placa es obligatoria"); return; }

    if (editingEntityId) {
      const response = await fetch(`/api/admin/entities/${editingEntityId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo, nombre, atributos })
      });
      const data = await response.json();
      if (!response.ok) { entityFormError(data.detail || "No se pudo actualizar el vehículo"); return; }
      closeForm();
      await loadEntities();
      return;
    }

    const response = await fetch("/api/admin/entities", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codigo, nombre, atributos })
    });
    const data = await response.json();
    if (!response.ok) { entityFormError(data.detail || "No se pudo crear el vehículo"); return; }

    closeForm();
    await loadEntities();
    showQrModal(`Vehículo ${codigo} creado`, `data:image/png;base64,${data.qr_base64}`, codigo);
  }

  async function deleteEntity(entityId, codigo) {
    if (!confirm(`¿Eliminar el vehículo ${codigo}? Esta acción no se puede deshacer.`)) return;
    const response = await fetch(`/api/admin/entities/${entityId}`, { method: "DELETE" });
    if (response.ok) {
      await loadEntities();
    } else {
      alert("No se pudo eliminar el vehículo.");
    }
  }

  function viewQr(entityId, codigo) {
    const url = `/api/admin/entities/${entityId}/qr`;
    showQrModal(`QR de ${codigo}`, url, codigo);
  }

  function togglePrintMode() {
    printMode = !printMode;
    selectedForPrint.clear();
    document.getElementById("printToolbar").classList.toggle("hidden", !printMode);
    document.getElementById("printToolbar").classList.toggle("flex", printMode);
    document.getElementById("tableSelectHeader").classList.toggle("hidden", !printMode);
    document.getElementById("printModeBtn").className = printMode
      ? "rounded-lg bg-gradient-to-br from-brand to-brand-dark px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-brand/25"
      : "rounded-lg border-2 border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:border-brand hover:text-brand";
    updatePrintSelectedCount();
    renderEntities();
  }

  function toggleSelectedForPrint(entityId) {
    if (selectedForPrint.has(entityId)) {
      selectedForPrint.delete(entityId);
    } else {
      selectedForPrint.add(entityId);
    }
    updatePrintSelectedCount();
  }

  function selectAllForPrint() {
    filteredEntities().forEach(e => selectedForPrint.add(e.id));
    updatePrintSelectedCount();
    renderEntities();
  }

  function selectNoneForPrint() {
    selectedForPrint.clear();
    updatePrintSelectedCount();
    renderEntities();
  }

  function updatePrintSelectedCount() {
    const count = selectedForPrint.size;
    document.getElementById("printSelectedCount").textContent = `${count} seleccionado${count === 1 ? "" : "s"}`;
  }

  function fetchImageAsDataUrl(url) {
    return fetch(url)
      .then(response => response.blob())
      .then(blob => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      }));
  }

  async function exportSelectedToPdf() {
    if (!selectedForPrint.size) { alert("Selecciona al menos un vehículo."); return; }
    const btn = document.getElementById("exportPdfBtn");
    const textoOriginal = btn.textContent;
    btn.textContent = "Generando…";
    btn.disabled = true;

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const seleccionados = entities.filter(e => selectedForPrint.has(e.id));

      const cols = 2, rows = 3;
      const cellW = 97, cellH = 93;
      const marginX = 8, marginY = 8;
      const qrSize = 48;
      const porPagina = cols * rows;

      for (let i = 0; i < seleccionados.length; i++) {
        const entity = seleccionados[i];
        const posEnPagina = i % porPagina;
        if (i > 0 && posEnPagina === 0) doc.addPage();

        const col = posEnPagina % cols;
        const row = Math.floor(posEnPagina / cols);
        const x = marginX + col * cellW;
        const y = marginY + row * cellH;

        doc.setDrawColor(210);
        doc.rect(x, y, cellW - 4, cellH - 4);

        let qrDataUrl;
        try {
          qrDataUrl = await fetchImageAsDataUrl(`/api/admin/entities/${entity.id}/qr`);
        } catch (e) {
          qrDataUrl = null;
        }

        const centroX = x + (cellW - 4) / 2;
        let textY = y + 5;

        if (qrDataUrl) {
          doc.addImage(qrDataUrl, "PNG", centroX - qrSize / 2, textY, qrSize, qrSize);
          textY += qrSize + 6;
        }

        const a = entity.atributos || {};
        doc.setFont(undefined, "bold");
        doc.setFontSize(12);
        doc.text(entity.codigo, centroX, textY, { align: "center" });
        textY += 5;

        doc.setFont(undefined, "normal");
        doc.setFontSize(8);
        const marcaModelo = [a.marca, a.modelo].filter(Boolean).join(" ") || entity.nombre || "";
        const lineas = [marcaModelo || null].filter(Boolean);
        lineas.forEach(linea => {
          doc.text(linea, centroX, textY, { align: "center" });
          textY += 4;
        });
      }

      doc.save(`vehiculos-qr-${new Date().toISOString().slice(0, 10)}.pdf`);
      togglePrintMode();
    } catch (err) {
      alert("No se pudo generar el PDF: " + err.message);
    } finally {
      btn.textContent = textoOriginal;
      btn.disabled = false;
    }
  }

  function exportInventario() {
    const rows = filteredEntities().map(e => {
      const a = e.atributos || {};
      return {
        placa: e.codigo,
        tipo: a.tipo || "—",
        marca: a.marca || "—",
        modelo: a.modelo || "—",
        año: a.año || "—",
        estado: a.estado || "—",
        razon_social: a.departamento || "—",
        combustible: a.combustible || "—"
      };
    });
    openExportModal({
      title: "Descargar Inventario de unidades",
      columns: [
        { key: "placa", label: "Placa" },
        { key: "tipo", label: "Tipo" },
        { key: "marca", label: "Marca" },
        { key: "modelo", label: "Modelo" },
        { key: "año", label: "Año" },
        { key: "estado", label: "Estado" },
        { key: "razon_social", label: "Razón social" },
        { key: "combustible", label: "Combustible" }
      ],
      rows,
      filenameBase: "inventario-unidades"
    });
  }

  (async function init() {
    const dept = await requireSession("/admin", "flota");
    if (!dept) return;
    renderNav("inventario", dept);
    switchInventoryView("lista");
    loadEntities();
  })();
</script>
