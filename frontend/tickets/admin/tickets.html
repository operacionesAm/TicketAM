<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets | TicketAM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#2a5298', dark: '#1e3c72' },
          accent: '#27ae60'
        }
      }
    }
  }
</script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">

  <div id="adminNav"></div>

  <div class="mx-auto max-w-5xl px-5 py-6 pb-16">
    <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex gap-2">
        <button id="typeBtnTodos" onclick="switchTicketType('todos')">📋 Todos</button>
        <button id="typeBtnReporte" onclick="switchTicketType('reporte')">🎫 Reportes</button>
        <button id="typeBtnAsignacion" onclick="switchTicketType('asignacion')">🚗 Asignaciones</button>
      </div>
      <div class="flex gap-2">
        <button id="viewBtnKanban" onclick="switchView('kanban')">🗂️ Kanban</button>
        <button id="viewBtnLista" onclick="switchView('lista')">📃 Lista</button>
        <button id="viewBtnArchivo" onclick="switchView('archivo')">🗄️ Archivo</button>
      </div>
    </div>

    <div id="kanbanBoard" class="flex snap-x snap-mandatory items-start gap-4 overflow-x-auto pb-4 sm:snap-none"></div>

    <div id="listView" class="hidden">
      <div id="statusFilterBar" class="mb-4 flex flex-wrap gap-2"></div>
      <div id="ticketList" class="space-y-2.5"></div>
    </div>

    <div id="archiveView" class="hidden">
      <p class="mb-4 text-sm text-slate-500">Tickets Resuelto/Cerrado (o Asignado/Negado) desde hace más de 5 días — se mueven aquí para mantener limpio el panel principal, pero quedan disponibles como historial.</p>
      <div id="archiveList" class="space-y-2.5"></div>
    </div>
  </div>

  <!-- MODAL DETALLE -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden items-start justify-center overflow-y-auto bg-black/50 p-5">
    <div class="my-8 w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">
      <div class="mb-4 flex items-start justify-between gap-3">
        <div>
          <div id="detailFolio" class="font-mono text-sm font-bold text-slate-400"></div>
          <h3 id="detailPlaca" class="text-lg font-bold text-brand-dark"></h3>
        </div>
        <button class="text-2xl leading-none text-slate-400 hover:text-slate-600" onclick="closeDetail()">&times;</button>
      </div>

      <div id="detailInfo" class="mb-5 grid grid-cols-1 gap-x-4 gap-y-2 text-sm sm:grid-cols-2"></div>

      <div id="detailFotoWrap" class="mb-5 hidden">
        <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-500">Foto</label>
        <img id="detailFoto" class="max-h-64 rounded-lg border-2 border-slate-100 object-contain">
      </div>

      <div id="detailVehiculoWrap" class="mb-5 hidden">
        <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-500">Vehículo asignado</label>
        <div class="flex flex-wrap gap-2">
          <select id="detailVehiculoSelect" class="min-w-[12rem] flex-1 rounded-lg border-2 border-slate-200 px-3 py-2 text-sm outline-none focus:border-brand">
            <option value="">-- Elige un vehículo --</option>
          </select>
          <button class="rounded-lg bg-accent px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700" onclick="confirmarAsignacion()">Asignar</button>
          <button class="rounded-lg bg-red-500 px-4 py-2 text-sm font-bold text-white hover:bg-red-600" onclick="negarVehiculo()">✕ Negar</button>
        </div>
        <p class="mt-1 text-xs text-slate-400">Al asignar una unidad el ticket pasa a "Asignado" y se notifica por correo al solicitante.</p>
      </div>

      <div class="mb-5">
        <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-500">Responsable</label>
        <div class="flex gap-2">
          <input id="detailResponsable" type="text" placeholder="Nombre de quien atiende el ticket" class="flex-1 rounded-lg border-2 border-slate-200 px-3 py-2 text-sm outline-none focus:border-brand">
          <button class="rounded-lg bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brand-dark" onclick="saveResponsable()">Guardar</button>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-500">Observaciones</label>
        <div id="detailObservaciones" class="mb-3 max-h-48 space-y-2 overflow-y-auto"></div>
        <textarea id="detailObservacionText" rows="2" placeholder="Escribe una observación para este ticket…" class="w-full rounded-lg border-2 border-slate-200 px-3 py-2 text-sm outline-none focus:border-brand"></textarea>
        <div class="mt-2 flex items-center justify-between gap-3">
          <label class="flex items-center gap-2 text-xs text-slate-500">
            <input id="detailNotificar" type="checkbox" class="h-4 w-4">
            Enviar por correo al solicitante
          </label>
          <button class="rounded-lg bg-accent px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700" onclick="submitObservacion()">Guardar observación</button>
        </div>
        <div id="detailObservacionError" class="mt-2 hidden text-xs font-semibold text-red-600"></div>
      </div>
    </div>
  </div>

<script src="/tickets/admin/admin-shared.js"></script>
<script>
  let ticketTypesByName = {};
  let allTickets = [];
  let entitiesById = {};
  let currentTicketType = "reporte";
  let currentView = "kanban";
  let listStatusFilter = "Todos";
  let detailTicketId = null;

  const TYPE_TAB_ACTIVE = ["rounded-lg", "px-4", "py-2.5", "text-sm", "font-bold", "text-white", "bg-gradient-to-br", "from-brand", "to-brand-dark", "shadow-md", "shadow-brand/25"];
  const TYPE_TAB_INACTIVE = ["rounded-lg", "px-4", "py-2.5", "text-sm", "font-bold", "text-slate-500", "bg-white", "hover:text-brand"];

  const FILTER_TAB_ACTIVE = ["rounded-full", "px-3.5", "py-1.5", "text-xs", "font-bold", "text-white", "bg-brand"];
  const FILTER_TAB_INACTIVE = ["rounded-full", "px-3.5", "py-1.5", "text-xs", "font-bold", "text-slate-500", "bg-white", "hover:text-brand"];

  const INCIDENT_TYPES = [
    { label: "Falla / Problema", desc: "Testigos en tablero, ruidos extraños, fallas mecánicas o eléctricas, motor no enciende." },
    { label: "Siniestro", desc: "Colisiones, volcaduras, robos, vandalismo o daños por fenómenos naturales." },
    { label: "Asistencia Urgente", desc: "Ponchaduras en ruta, falta de combustible, vehículo varado o necesidad de grúa." },
    { label: "Mantenimiento Preventivo", desc: "Servicios programados, rotación de llantas, afinaciones o verificación." },
    { label: "Mantenimiento Correctivo", desc: "Reparación o reemplazo de piezas previamente diagnosticadas." }
  ];
  const PRIORIDADES = ["Alta", "Media", "Baja"];
  const PRIORIDAD_CLASSES = {
    "Alta": "bg-red-100 text-red-700",
    "Media": "bg-amber-100 text-amber-800",
    "Baja": "bg-slate-200 text-slate-600"
  };

  const ESTADOS_FINALES = new Set(["Resuelto", "Cerrado", "Asignado", "Negado"]);
  const DIAS_PARA_ARCHIVAR = 5;

  function isArchived(ticket) {
    if (!ESTADOS_FINALES.has(ticket.estado) || !ticket.resolved_at) return false;
    const dias = (Date.now() - new Date(ticket.resolved_at).getTime()) / 86400000;
    return dias > DIAS_PARA_ARCHIVAR;
  }

  async function loadTickets() {
    const [ticketsRes, entitiesRes] = await Promise.all([
      fetch("/api/admin/tickets"),
      fetch("/api/admin/entities")
    ]);
    if (ticketsRes.status === 401) { location.href = "/admin"; return; }
    const data = await ticketsRes.json();
    ticketTypesByName = {};
    (data.ticket_types || []).forEach(t => ticketTypesByName[t.name] = t);
    allTickets = data.tickets || [];

    entitiesById = {};
    if (entitiesRes.ok) {
      const entitiesData = await entitiesRes.json();
      (entitiesData.entities || []).forEach(e => entitiesById[e.id] = e);
    }
    render();
  }

  function vehiculoLabel(ticket) {
    const entity = entitiesById[ticket.entity_id];
    if (!entity) return null;
    const a = entity.atributos || {};
    const marcaModelo = [a.marca, a.modelo].filter(Boolean).join(" ") || entity.nombre || "";
    return { placa: entity.codigo, marcaModelo };
  }

  function vehiculoBadgeHtml(ticket) {
    const vehiculo = vehiculoLabel(ticket);
    if (!vehiculo) return "";
    return `<span class="rounded-full bg-brand/10 px-2 py-0.5 text-[11px] font-bold text-brand-dark">${vehiculo.placa}</span>`;
  }

  // Solo "Solicitud de vehículo" puede recibir la asignación de una unidad
  // del inventario — "Reporte de falla" ya trae su vehículo desde que se crea.
  function isAsignacionTicket(ticket) {
    const type = ticketTypesByName["Solicitud de vehículo"];
    return !!type && ticket.ticket_type_id === type.id;
  }

  // Activo = cualquier unidad que no esté explícitamente "Inactivo", mismo
  // criterio que ya usa inventario.html para sus contadores y badges.
  function activeEntities() {
    return Object.values(entitiesById).filter(e => ((e.atributos || {}).estado) !== "Inactivo");
  }

  function vehiculoOptionsHtml(selectedEntityId) {
    return activeEntities()
      .slice()
      .sort((a, b) => a.codigo.localeCompare(b.codigo))
      .map(e => {
        const a = e.atributos || {};
        const label = [e.codigo, [a.marca, a.modelo].filter(Boolean).join(" ")].filter(Boolean).join(" — ");
        return `<option value="${e.id}" ${selectedEntityId === e.id ? "selected" : ""}>${label}</option>`;
      }).join("");
  }

  function vehiculoPickerHtml(ticket) {
    return `
      <select class="w-full rounded-md border border-slate-200 bg-white px-2 py-1 text-[11px] font-semibold text-brand-dark" onchange="assignVehiculo('${ticket.id}', this.value)">
        <option value="">🚗 Asignar vehículo…</option>
        ${vehiculoOptionsHtml(ticket.entity_id)}
      </select>
    `;
  }

  async function assignVehiculo(ticketId, entityId) {
    const ticket = allTickets.find(t => t.id === ticketId);
    if (!ticket) return;
    const response = await fetch(`/api/admin/tickets/${ticketId}/vehiculo`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ entity_id: entityId || null })
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      alert(data.detail || "No se pudo asignar el vehículo.");
    } else {
      const data = await response.json();
      Object.assign(ticket, data.ticket);
    }
    render();
    if (detailTicketId === ticketId) openDetail(ticketId);
  }

  function confirmarAsignacion() {
    if (!detailTicketId) return;
    const entityId = document.getElementById("detailVehiculoSelect").value;
    if (!entityId) { alert("Elige un vehículo primero."); return; }
    assignVehiculo(detailTicketId, entityId);
  }

  async function negarVehiculo() {
    if (!detailTicketId) return;
    if (!confirm("¿Negar esta solicitud de vehículo?")) return;
    const ticket = allTickets.find(t => t.id === detailTicketId);
    if (!ticket) return;
    const response = await fetch(`/api/admin/tickets/${detailTicketId}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ estado: "Negado", comentario: "" })
    });
    if (!response.ok) { alert("No se pudo negar la solicitud."); return; }
    const data = await response.json();
    Object.assign(ticket, data.ticket);
    render();
    if (detailTicketId === ticket.id) openDetail(ticket.id);
  }

  function fotoBadgeHtml(ticket) {
    if (!(ticket.campos || {}).foto_path) return "";
    return `<span class="text-xs" title="Tiene foto adjunta">📷</span>`;
  }

  function switchTicketType(type) {
    currentTicketType = type;
    listStatusFilter = "Todos";
    document.getElementById("typeBtnTodos").className = (type === "todos" ? TYPE_TAB_ACTIVE : TYPE_TAB_INACTIVE).join(" ");
    document.getElementById("typeBtnReporte").className = (type === "reporte" ? TYPE_TAB_ACTIVE : TYPE_TAB_INACTIVE).join(" ");
    document.getElementById("typeBtnAsignacion").className = (type === "asignacion" ? TYPE_TAB_ACTIVE : TYPE_TAB_INACTIVE).join(" ");
    render();
  }

  function switchView(view) {
    currentView = view;
    document.getElementById("viewBtnKanban").className = (view === "kanban" ? TYPE_TAB_ACTIVE : TYPE_TAB_INACTIVE).join(" ");
    document.getElementById("viewBtnLista").className = (view === "lista" ? TYPE_TAB_ACTIVE : TYPE_TAB_INACTIVE).join(" ");
    document.getElementById("viewBtnArchivo").className = (view === "archivo" ? TYPE_TAB_ACTIVE : TYPE_TAB_INACTIVE).join(" ");
    document.getElementById("kanbanBoard").classList.toggle("hidden", view !== "kanban");
    document.getElementById("listView").classList.toggle("hidden", view !== "lista");
    document.getElementById("archiveView").classList.toggle("hidden", view !== "archivo");
    render();
  }

  function currentType() {
    const name = currentTicketType === "reporte" ? "Reporte de falla" : "Solicitud de vehículo";
    return ticketTypesByName[name] || null;
  }

  // "Todos" combina Reportes + Asignaciones. Se usa en Lista y Archivo; el
  // Kanban se queda por tipo porque sus columnas son los estados de un solo
  // tipo (mezclarlos no tiene un dueño claro para el drag-and-drop).
  function currentTicketTypeIds() {
    if (currentTicketType === "todos") {
      return Object.values(ticketTypesByName).map(t => t.id);
    }
    const type = currentType();
    return type ? [type.id] : [];
  }

  function estadosForTicket(ticket) {
    const type = Object.values(ticketTypesByName).find(t => t.id === ticket.ticket_type_id);
    return type ? type.estados : [];
  }

  function combinedEstados() {
    const all = Object.values(ticketTypesByName).flatMap(t => t.estados);
    return [...new Set(all)];
  }

  function tipoBadgeHtml(ticket) {
    if (currentTicketType !== "todos") return "";
    const type = Object.values(ticketTypesByName).find(t => t.id === ticket.ticket_type_id);
    if (!type) return "";
    const esReporte = type.name === "Reporte de falla";
    return `<span class="rounded-full ${esReporte ? "bg-amber-100 text-amber-800" : "bg-sky-100 text-sky-800"} px-2 py-0.5 text-[11px] font-bold">${esReporte ? "🎫 Reporte" : "🚗 Asignación"}</span>`;
  }

  function render() {
    if (currentView === "kanban") {
      renderBoard();
    } else if (currentView === "lista") {
      renderList();
    } else {
      renderArchive();
    }
  }

  function renderBoard() {
    const board = document.getElementById("kanbanBoard");
    if (currentTicketType === "todos") {
      board.innerHTML = '<div class="py-16 text-center text-slate-400">El Kanban es por tipo de ticket — elige Reportes o Asignaciones. "Todos" está disponible en Lista y Archivo.</div>';
      return;
    }
    const type = currentType();
    if (!type) {
      board.innerHTML = '<div class="py-16 text-center text-slate-400">Este departamento todavía no tiene configurado este tipo de ticket.</div>';
      return;
    }
    const filtered = allTickets.filter(t => t.ticket_type_id === type.id && !isArchived(t));
    board.innerHTML = type.estados.map(estado => {
      const cards = filtered.filter(t => t.estado === estado);
      return `
        <div class="kanban-column w-[82vw] max-w-xs shrink-0 snap-center rounded-2xl bg-black/10 p-3 sm:w-72" data-estado="${estado}">
          <div class="mb-3 flex items-center justify-between px-1">
            <h4 class="text-sm font-bold text-slate-600">${estado}</h4>
            <span class="rounded-full bg-white px-2 py-0.5 text-xs font-bold text-slate-500">${cards.length}</span>
          </div>
          <div class="min-h-[60px] space-y-2.5">${cards.map(renderCard).join("")}</div>
        </div>
      `;
    }).join("");
  }

  function classifySelects(ticket) {
    const reporteType = ticketTypesByName["Reporte de falla"];
    if (!reporteType || ticket.ticket_type_id !== reporteType.id) return "";
    return `
      <select class="w-full rounded-md border border-slate-200 bg-white px-2 py-1 text-[11px]" onchange="classifyTicket('${ticket.id}', 'incidente_tipo', this.value)">
        <option value="">Tipo de incidente…</option>
        ${INCIDENT_TYPES.map(i => `<option value="${i.label}" title="${i.desc}" ${ticket.incidente_tipo === i.label ? "selected" : ""}>${i.label}</option>`).join("")}
      </select>
      <select class="w-full rounded-md border border-slate-200 bg-white px-2 py-1 text-[11px]" onchange="classifyTicket('${ticket.id}', 'prioridad', this.value)">
        <option value="">Prioridad…</option>
        ${PRIORIDADES.map(p => `<option value="${p}" ${ticket.prioridad === p ? "selected" : ""}>${p}</option>`).join("")}
      </select>
    `;
  }

  function renderCard(ticket) {
    const campos = ticket.campos || {};
    const resumen = campos.descripcion || campos.proposito || "";
    const prioridadBadge = ticket.prioridad
      ? `<span class="rounded-full px-2 py-0.5 text-[11px] font-bold ${PRIORIDAD_CLASSES[ticket.prioridad]}">${ticket.prioridad}</span>`
      : "";
    const classify = classifySelects(ticket);
    const classifyHtml = classify
      ? `<div class="mt-2.5 space-y-1.5 border-t border-slate-100 pt-2.5">${classify}</div>`
      : "";
    const vehiculoHtml = isAsignacionTicket(ticket)
      ? `<div class="mt-2.5 space-y-1.5 border-t border-slate-100 pt-2.5">${vehiculoPickerHtml(ticket)}</div>`
      : "";
    return `
      <div class="kanban-card cursor-grab rounded-xl bg-white p-3.5 shadow-sm active:cursor-grabbing" draggable="true" data-ticket-id="${ticket.id}">
        <div class="flex items-start justify-between gap-2">
          <div class="font-mono text-[11px] font-bold text-slate-400">${ticket.folio}</div>
          ${prioridadBadge}
        </div>
        <div class="mt-1 text-sm font-bold text-brand-dark">${ticket.solicitante_nombre}</div>
        <div class="mt-1 text-xs text-slate-500">${resumen}</div>
        <div class="mt-1.5 flex items-center gap-1.5">${vehiculoBadgeHtml(ticket)}${fotoBadgeHtml(ticket)}</div>
        <div class="mt-1 text-[11px] text-slate-400">${formatDate(ticket.created_at)}</div>
        ${classifyHtml}
        ${vehiculoHtml}
        <button class="mt-2.5 w-full rounded-md border border-slate-200 py-1 text-[11px] font-semibold text-brand hover:bg-slate-50" onclick="openDetail('${ticket.id}')">Ver detalle</button>
      </div>
    `;
  }

  async function classifyTicket(ticketId, field, value) {
    const ticket = allTickets.find(t => t.id === ticketId);
    if (!ticket) return;
    ticket[field] = value || null;
    const response = await fetch(`/api/admin/tickets/${ticketId}/classify`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ incidente_tipo: ticket.incidente_tipo || null, prioridad: ticket.prioridad || null })
    });
    if (!response.ok) { alert("No se pudo clasificar el ticket."); }
    render();
  }

  async function moveTicket(ticketId, nuevoEstado) {
    const ticket = allTickets.find(t => t.id === ticketId);
    if (!ticket || ticket.estado === nuevoEstado) return;
    const previo = ticket.estado;
    ticket.estado = nuevoEstado;
    render();
    const response = await fetch(`/api/admin/tickets/${ticketId}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ estado: nuevoEstado, comentario: "" })
    });
    if (!response.ok) {
      ticket.estado = previo;
      render();
      alert("No se pudo mover el ticket.");
    }
  }

  function switchListStatusFilter(estado) {
    listStatusFilter = estado;
    renderList();
  }

  function renderList() {
    const typeIds = currentTicketTypeIds();
    const filterBar = document.getElementById("statusFilterBar");
    const list = document.getElementById("ticketList");
    if (!typeIds.length) {
      filterBar.innerHTML = "";
      list.innerHTML = '<div class="py-16 text-center text-slate-400">Este departamento todavía no tiene configurado este tipo de ticket.</div>';
      return;
    }

    const filtered = allTickets.filter(t => typeIds.includes(t.ticket_type_id) && !isArchived(t));
    const estadosDisponibles = currentTicketType === "todos" ? combinedEstados() : currentType().estados;
    const filters = ["Todos", ...estadosDisponibles];
    filterBar.innerHTML = filters.map(estado => {
      const count = estado === "Todos" ? filtered.length : filtered.filter(t => t.estado === estado).length;
      const active = listStatusFilter === estado;
      return `<button class="${(active ? FILTER_TAB_ACTIVE : FILTER_TAB_INACTIVE).join(" ")}" onclick="switchListStatusFilter('${estado}')">${estado} (${count})</button>`;
    }).join("");

    const visible = (listStatusFilter === "Todos" ? filtered : filtered.filter(t => t.estado === listStatusFilter))
      .slice()
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    if (!visible.length) {
      list.innerHTML = '<div class="py-16 text-center text-slate-400">Sin tickets para este filtro.</div>';
      return;
    }
    list.innerHTML = visible.map(t => renderListRow(t, estadosForTicket(t))).join("");
  }

  function renderListRow(ticket, estados) {
    const campos = ticket.campos || {};
    const resumen = campos.descripcion || campos.proposito || "";
    const prioridadBadge = ticket.prioridad
      ? `<span class="rounded-full px-2 py-0.5 text-[11px] font-bold ${PRIORIDAD_CLASSES[ticket.prioridad]}">${ticket.prioridad}</span>`
      : "";
    return `
      <div class="flex flex-wrap items-center gap-3 rounded-xl bg-white p-3.5 shadow-sm sm:flex-nowrap" data-ticket-id="${ticket.id}">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-mono text-[11px] font-bold text-slate-400">${ticket.folio}</span>
            ${tipoBadgeHtml(ticket)}
            ${prioridadBadge}
          </div>
          <div class="mt-1 text-sm font-bold text-brand-dark">${ticket.solicitante_nombre}</div>
          <div class="mt-1 truncate text-xs text-slate-500">${resumen}</div>
          <div class="mt-1.5 flex items-center gap-1.5">${vehiculoBadgeHtml(ticket)}${fotoBadgeHtml(ticket)}</div>
          <div class="mt-1 text-[11px] text-slate-400">${formatDate(ticket.created_at)}</div>
          <button class="mt-1.5 text-[11px] font-semibold text-brand underline" onclick="openDetail('${ticket.id}')">Ver detalle</button>
        </div>
        <div class="flex w-full shrink-0 flex-col gap-1.5 sm:w-56">
          ${classifySelects(ticket)}
          ${isAsignacionTicket(ticket) ? vehiculoPickerHtml(ticket) : ""}
          <select class="w-full rounded-full border-2 border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-brand-dark outline-none focus:border-brand" onchange="moveTicket('${ticket.id}', this.value)">
            ${estados.map(estado => `<option value="${estado}" ${ticket.estado === estado ? "selected" : ""}>${estado}</option>`).join("")}
          </select>
        </div>
      </div>
    `;
  }

  function renderArchive() {
    const typeIds = currentTicketTypeIds();
    const list = document.getElementById("archiveList");
    if (!typeIds.length) {
      list.innerHTML = '<div class="py-16 text-center text-slate-400">Este departamento todavía no tiene configurado este tipo de ticket.</div>';
      return;
    }
    const archived = allTickets
      .filter(t => typeIds.includes(t.ticket_type_id) && isArchived(t))
      .slice()
      .sort((a, b) => new Date(b.resolved_at) - new Date(a.resolved_at));

    if (!archived.length) {
      list.innerHTML = '<div class="py-16 text-center text-slate-400">Sin tickets archivados todavía.</div>';
      return;
    }
    list.innerHTML = archived.map(renderArchiveRow).join("");
  }

  function renderArchiveRow(ticket) {
    const campos = ticket.campos || {};
    const resumen = campos.descripcion || campos.proposito || "";
    const diasArchivado = Math.floor((Date.now() - new Date(ticket.resolved_at).getTime()) / 86400000);
    return `
      <div class="flex flex-wrap items-center gap-3 rounded-xl bg-white p-3.5 opacity-80 shadow-sm sm:flex-nowrap">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-mono text-[11px] font-bold text-slate-400">${ticket.folio}</span>
            ${tipoBadgeHtml(ticket)}
            <span class="rounded-full bg-slate-200 px-2 py-0.5 text-[11px] font-bold text-slate-600">${ticket.estado}</span>
          </div>
          <div class="mt-1 text-sm font-bold text-brand-dark">${ticket.solicitante_nombre}</div>
          <div class="mt-1 truncate text-xs text-slate-500">${resumen}</div>
          <div class="mt-1.5 flex items-center gap-1.5">${vehiculoBadgeHtml(ticket)}${fotoBadgeHtml(ticket)}</div>
          <div class="mt-1 text-[11px] text-slate-400">Resuelto el ${formatDate(ticket.resolved_at)} · archivado hace ${diasArchivado} días</div>
        </div>
        <button class="shrink-0 rounded-md border border-slate-200 px-3 py-1.5 text-xs font-semibold text-brand hover:bg-slate-50" onclick="openDetail('${ticket.id}')">Ver detalle</button>
      </div>
    `;
  }

  async function openDetail(ticketId) {
    const ticket = allTickets.find(t => t.id === ticketId);
    if (!ticket) return;
    detailTicketId = ticketId;

    const campos = ticket.campos || {};
    const vehiculo = vehiculoLabel(ticket);
    document.getElementById("detailFolio").textContent = ticket.folio;
    document.getElementById("detailPlaca").textContent = vehiculo ? `${vehiculo.placa} — ${vehiculo.marcaModelo}` : "Sin vehículo asociado";

    const info = [
      ["Fecha/hora", formatDate(ticket.created_at)],
      ["Operador / solicitante", ticket.solicitante_nombre],
      ["Correo", ticket.solicitante_email],
      ["Número de nómina", campos.numero_nomina || "—"],
      ["Descripción", campos.descripcion || campos.proposito || "—"],
      ["Estado", ticket.estado],
      ["Prioridad", ticket.prioridad || "—"],
      ["Fecha de resolución", ticket.resolved_at ? formatDate(ticket.resolved_at) : "—"]
    ];
    document.getElementById("detailInfo").innerHTML = info.map(([label, value]) => `
      <div>
        <div class="text-[11px] font-bold uppercase tracking-wide text-slate-400">${label}</div>
        <div class="text-slate-700">${value}</div>
      </div>
    `).join("");

    const fotoWrap = document.getElementById("detailFotoWrap");
    if (campos.foto_path) {
      document.getElementById("detailFoto").src = `/api/admin/tickets/${ticket.id}/foto`;
      fotoWrap.classList.remove("hidden");
    } else {
      fotoWrap.classList.add("hidden");
    }

    const vehiculoWrap = document.getElementById("detailVehiculoWrap");
    if (isAsignacionTicket(ticket)) {
      document.getElementById("detailVehiculoSelect").innerHTML = `<option value="">-- Elige un vehículo --</option>${vehiculoOptionsHtml(ticket.entity_id)}`;
      vehiculoWrap.classList.remove("hidden");
    } else {
      vehiculoWrap.classList.add("hidden");
    }

    document.getElementById("detailResponsable").value = ticket.responsable_nombre || "";
    document.getElementById("detailObservacionText").value = "";
    document.getElementById("detailNotificar").checked = false;
    document.getElementById("detailObservacionError").classList.add("hidden");
    document.getElementById("detailObservaciones").innerHTML = `<div class="text-xs text-slate-400">Cargando…</div>`;

    document.getElementById("detailModal").classList.remove("hidden");
    document.getElementById("detailModal").classList.add("flex");

    loadObservaciones(ticketId);
  }

  function closeDetail() {
    detailTicketId = null;
    document.getElementById("detailModal").classList.add("hidden");
    document.getElementById("detailModal").classList.remove("flex");
  }

  async function loadObservaciones(ticketId) {
    const response = await fetch(`/api/admin/events?ticket_id=${ticketId}`);
    const el = document.getElementById("detailObservaciones");
    if (!response.ok) { el.innerHTML = `<div class="text-xs text-red-500">No se pudo cargar el historial.</div>`; return; }
    const data = await response.json();
    const observaciones = (data.events || []).filter(e => e.accion === "observacion");
    if (!observaciones.length) {
      el.innerHTML = `<div class="text-xs text-slate-400">Sin observaciones todavía.</div>`;
      return;
    }
    el.innerHTML = observaciones.map(e => `
      <div class="rounded-lg bg-slate-50 p-2.5 text-xs">
        <div class="text-slate-700">${e.comentario}</div>
        <div class="mt-1 text-[10px] text-slate-400">${formatDate(e.created_at)}</div>
      </div>
    `).join("");
  }

  async function saveResponsable() {
    if (!detailTicketId) return;
    const responsable_nombre = document.getElementById("detailResponsable").value.trim();
    const response = await fetch(`/api/admin/tickets/${detailTicketId}/responsable`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ responsable_nombre })
    });
    if (!response.ok) { alert("No se pudo guardar el responsable."); return; }
    const ticket = allTickets.find(t => t.id === detailTicketId);
    if (ticket) ticket.responsable_nombre = responsable_nombre || null;
  }

  async function submitObservacion() {
    if (!detailTicketId) return;
    const comentario = document.getElementById("detailObservacionText").value.trim();
    const errorEl = document.getElementById("detailObservacionError");
    errorEl.classList.add("hidden");
    if (!comentario) { errorEl.textContent = "Escribe una observación."; errorEl.classList.remove("hidden"); return; }
    const notificar_email = document.getElementById("detailNotificar").checked;

    const response = await fetch(`/api/admin/tickets/${detailTicketId}/observaciones`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ comentario, notificar_email })
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      errorEl.textContent = data.detail || "No se pudo guardar la observación.";
      errorEl.classList.remove("hidden");
      return;
    }
    document.getElementById("detailObservacionText").value = "";
    document.getElementById("detailNotificar").checked = false;
    loadObservaciones(detailTicketId);
  }

  (function setupDragAndDrop() {
    const board = document.getElementById("kanbanBoard");
    board.addEventListener("dragstart", e => {
      const card = e.target.closest(".kanban-card");
      if (!card) return;
      e.dataTransfer.setData("text/plain", card.dataset.ticketId);
      e.dataTransfer.effectAllowed = "move";
      card.classList.add("opacity-40");
    });
    board.addEventListener("dragend", e => {
      const card = e.target.closest(".kanban-card");
      if (card) card.classList.remove("opacity-40");
    });
    board.addEventListener("dragover", e => {
      const column = e.target.closest(".kanban-column");
      if (!column) return;
      e.preventDefault();
      column.classList.add("ring-2", "ring-brand");
    });
    board.addEventListener("dragleave", e => {
      const column = e.target.closest(".kanban-column");
      if (column) column.classList.remove("ring-2", "ring-brand");
    });
    board.addEventListener("drop", e => {
      const column = e.target.closest(".kanban-column");
      if (!column) return;
      e.preventDefault();
      column.classList.remove("ring-2", "ring-brand");
      const ticketId = e.dataTransfer.getData("text/plain");
      if (ticketId) moveTicket(ticketId, column.dataset.estado);
    });
  })();

  (async function init() {
    const dept = await requireSession();
    if (!dept) return;
    renderNav("tickets", dept);
    switchView("kanban");
    switchTicketType("reporte");
    loadTickets();
  })();
</script>
</body>
</html>
